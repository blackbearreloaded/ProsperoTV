name: "Feature request"
description: "An idea or improvement for ProsperoTV"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you post**

        - ProsperoTV ships no channels. Do not post or ask for playlists, provider names, logins or stream links.
        - Remove playlist addresses and credentials from logs and screenshots.
        - Do not post Sony SDK files, firmware, decrypted system files, keys or links to them.
  - type: textarea
    id: problem
    attributes:
      label: "What would you like to do that you cannot do now?"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: "How could it work?"
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: "Checks"
      options:
        - label: "I searched the open and closed issues for this idea."
          required: true
