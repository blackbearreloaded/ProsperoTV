# ps5-native-app-boilerplate - ProsperoTV lint, test, build, and release validation.
#
# Two builds on every pull request, version tag, and run started by hand (a push
# to main builds nothing): the shared code with the earlier
# interface (job "build": lint, tests, the clean-room runtime), and the released
# app from opengl-ui/ (job "app"). A version tag, which must equal param.json's
# contentVersion, also publishes: job "release" attaches the ZIP job "app"
# built, with its checksum, to a GitHub Release. Nothing built anywhere else is
# ever attached, and a release that already has a ZIP is never changed.
# Both builds keep their compiler cache between runs, each its own.
# Copyright (C) 2026 BlackBearReloaded
# SPDX-License-Identifier: GPL-3.0-or-later

name: Build

on:
  # A build on main is started by hand (Run workflow): pushes to main build nothing.
  push:
    tags:
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Also hand over this run's compiler caches as the build-cache snapshots (run it on main)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 lld-18 libsqlite3-dev libavcodec-dev libswresample-dev ffmpeg make ccache pkg-config tar unzip wget

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-build-${{ runner.os }}-${{ runner.arch }}-clang18-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-build-${{ runner.os }}-${{ runner.arch }}-clang18-

      # GitHub drops a cache nobody used for a week, and a pull request only sees main's. When
      # nothing was restored, start from the snapshot kept as a file of the build-cache release;
      # a manual run with "snapshot" ticked hands over a new one.
      - name: Fetch the compiler cache snapshot
        run: |
          if [ -z "$(ls -A "$CCACHE_DIR" 2>/dev/null)" ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/build-cache/ccache-clang18-build.tar"
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache-clang18-build.tar" "$url"; then
              mkdir -p "$CCACHE_DIR"
              tar -xf "$RUNNER_TEMP/ccache-clang18-build.tar" -C "$CCACHE_DIR"
              rm "$RUNNER_TEMP/ccache-clang18-build.tar"
              echo "::notice title=Compiler cache::Started from the build-cache snapshot."
            fi
          fi

      - name: Send the compilers through the cache
        run: |
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Read app identity and version
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$content_version" ]]; then
            echo "Release tag must exactly match param.json contentVersion: $content_version" >&2
            exit 2
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"

      # A pull request's build is named by its number and its own commit, on the
      # artifact and inside the app folder (docs/PULL_REQUEST_BUILDS.md); the
      # version in param.json stays the release's.
      - name: Name this build
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            short=${PR_HEAD:0:7}
            echo "artifact=${GITHUB_REPOSITORY##*/}-PR$PR_NUMBER-$short" >> "$GITHUB_OUTPUT"
            echo "BUILD_LABEL=PR $PR_NUMBER, $short" >> "$GITHUB_ENV"
          else
            echo "artifact=prospero-tv-$GITHUB_SHA-release" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint source and metadata
        run: LINT_SKIP_TIDY=1 make lint

      - name: Run host GoogleTest suite
        run: make test-unit HOST_CXX="ccache clang++" HOST_CC="ccache clang"

      - name: Run host integration tests
        run: make test-integration

      - name: Test MP4 and Matroska playback
        run: HOST_CXX=clang++-18 make test-media

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime is unchanged
        run: cd runtime && sha256sum -c libc.prx.sha256

      # The ZIP is the one format builds and releases carry; no image is built here.
      - name: Build the app folder
        run: make app

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      # ccache compresses what it stores, so the snapshot is a plain tar.
      - name: Pack the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        run: tar -cf "$RUNNER_TEMP/ccache-clang18-build.tar" -C "$CCACHE_DIR" .

      - name: Upload the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccache-snapshot-build
          path: ${{ runner.temp }}/ccache-clang18-build.tar
          if-no-files-found: error
          retention-days: 1

      - name: Package folder release
        run: |
          cd dist
          python3 -m zipfile -c "$TITLE_ID.zip" "$TITLE_ID"
          python3 ../tools/zip-open-modes.py "$TITLE_ID.zip"

      - name: Check that every ZIP entry is open to all
        run: |
          python3 - "dist/$TITLE_ID.zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              entries = archive.infolist()
              wrong = [i.filename for i in entries if (i.external_attr >> 16) & 0o777 != 0o777]
              if not entries or wrong or archive.testzip() is not None:
                  raise SystemExit(f"ZIP check failed: {len(entries)} entries, not 0777: {wrong[:5]}")
              names = {i.filename for i in entries}
              title = entries[0].filename.split("/")[0]
              for needed in ("eboot.bin", "sce_sys/param.json"):
                  if f"{title}/{needed}" not in names:
                      raise SystemExit(f"ZIP check failed: {title}/{needed} is missing")
              print(f"{len(entries)} entries, all stored as 0777")
          PY

      - name: Write release checksums
        run: cd dist && sha256sum "$TITLE_ID.zip" > SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  app:
    name: Build the app (opengl-ui)
    runs-on: ubuntu-24.04
    # The attest step signs with this run's identity and stores the attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 500M
    outputs:
      artifact: ${{ steps.label.outputs.artifact }}
      title_id: ${{ steps.identity.outputs.title_id }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18 ninja-build ccache cmake libsqlite3-dev libpng-dev libjpeg-dev zlib1g-dev make pkg-config curl tar unzip wget xz-utils

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-app-${{ runner.os }}-${{ runner.arch }}-clang18-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-app-${{ runner.os }}-${{ runner.arch }}-clang18-

      # GitHub drops a cache nobody used for a week, and a pull request only sees main's. When
      # nothing was restored, start from the snapshot kept as a file of the build-cache release;
      # a manual run with "snapshot" ticked hands over a new one.
      - name: Fetch the compiler cache snapshot
        run: |
          if [ -z "$(ls -A "$CCACHE_DIR" 2>/dev/null)" ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/build-cache/ccache-clang18-app.tar"
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache-clang18-app.tar" "$url"; then
              mkdir -p "$CCACHE_DIR"
              tar -xf "$RUNNER_TEMP/ccache-clang18-app.tar" -C "$CCACHE_DIR"
              rm "$RUNNER_TEMP/ccache-clang18-app.tar"
              echo "::notice title=Compiler cache::Started from the build-cache snapshot."
            fi
          fi

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Read app identity and version
        id: identity
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$content_version" ]]; then
            echo "Release tag must exactly match param.json contentVersion: $content_version" >&2
            exit 2
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"
          echo "title_id=$title_id" >> "$GITHUB_OUTPUT"

      - name: Name the app's artifact
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            echo "artifact=${GITHUB_REPOSITORY##*/}-app-PR$PR_NUMBER-${PR_HEAD:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=${GITHUB_REPOSITORY##*/}-app-$CONTENT_VERSION-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test the interface and its logic
        run: HOST_CXX=clang++-18 bash opengl-ui/tools/run-tests.sh

      # Everything the app is built from is fetched here at a pinned version and
      # checked: the UI kit, the OpenGL SDK, the payload SDK, the ports, the
      # audio decoders, the fonts and the helper sent to the payload loader.
      - name: Assemble the build tree
        run: HOST_CXX=clang++-18 bash opengl-ui/ps5/assemble.sh "$RUNNER_TEMP/app-build"

      - name: Build the app
        run: make -C "$RUNNER_TEMP/app-build" app

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      # ccache compresses what it stores, so the snapshot is a plain tar.
      - name: Pack the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        run: tar -cf "$RUNNER_TEMP/ccache-clang18-app.tar" -C "$CCACHE_DIR" .

      - name: Upload the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccache-snapshot-app
          path: ${{ runner.temp }}/ccache-clang18-app.tar
          if-no-files-found: error
          retention-days: 1

      - name: Package the release ZIP
        shell: bash
        run: |
          mkdir -p dist-app
          cp "$RUNNER_TEMP/app-build/dist/$TITLE_ID.zip" "dist-app/$TITLE_ID.zip"
          python3 tools/zip-open-modes.py "dist-app/$TITLE_ID.zip"
          python3 - "dist-app/$TITLE_ID.zip" "$TITLE_ID" "$CONTENT_VERSION" <<'PY'
          import json, sys, zipfile
          path, title, version = sys.argv[1:4]
          with zipfile.ZipFile(path) as archive:
              entries = archive.infolist()
              wrong = [i.filename for i in entries if (i.external_attr >> 16) & 0o777 != 0o777]
              if not entries or wrong or archive.testzip() is not None:
                  raise SystemExit(f"ZIP check failed: {len(entries)} entries, not 0777: {wrong[:5]}")
              names = {i.filename for i in entries}
              outside = [n for n in names if not n.startswith(title + "/")]
              if outside:
                  raise SystemExit(f"ZIP check failed: entries outside {title}/: {outside[:5]}")
              for needed in ("eboot.bin", "sce_sys/param.json", "sce_sys/icon0.png", "lapy.elf",
                             "self-updater.elf"):
                  if f"{title}/{needed}" not in names:
                      raise SystemExit(f"ZIP check failed: {title}/{needed} is missing")
              param = json.loads(archive.read(f"{title}/sce_sys/param.json"))
              if param["titleId"] != title or param["contentVersion"] != version:
                  raise SystemExit("ZIP check failed: param.json is not this title at this version")
              print(f"{len(entries)} entries, all stored as 0777; {title} {version}")
          PY
          (cd dist-app && sha256sum "$TITLE_ID.zip" > SHA256SUMS && cat SHA256SUMS)

      # Signed provenance: this ZIP was built by this workflow from this commit. Anyone can check a
      # downloaded copy with `gh attestation verify <file> -R <owner>/<repo>`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release ZIP
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist-app/${{ env.TITLE_ID }}.zip

      - name: Upload the app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist-app/${{ env.TITLE_ID }}.zip
            dist-app/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [build, app]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs/releases

      - name: Download the app this run built
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.app.outputs.artifact }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "$ARTIFACT"
          --dir release

      - name: Check the download
        shell: bash
        env:
          TITLE_ID: ${{ needs.app.outputs.title_id }}
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' files < <(find . -type f -print0)
          if (( ${#files[@]} != 2 )) || [[ ! -f $TITLE_ID.zip || ! -f SHA256SUMS ]]; then
            echo "Expected exactly $TITLE_ID.zip and SHA256SUMS in the artifact." >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE_ID: ${{ needs.app.outputs.title_id }}
        run: |
          set -euo pipefail
          TAG=$GITHUB_REF_NAME
          assets=("release/$TITLE_ID.zip" "release/SHA256SUMS")
          notes="docs/releases/$GITHUB_REF_NAME.md"
          # The files of a release come from the run of its tag, once. A release without a
          # ZIP (notes written in advance, or a draft) gets them and keeps its title and
          # notes; one that already has a ZIP is never touched, because the catalog records
          # that ZIP's checksum.
          if names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
            has_zip=0
            while IFS= read -r name; do
              if [[ $name == *.zip ]]; then has_zip=1; fi
            done <<< "$names"
            if (( has_zip )); then
              echo "::warning title=Release files not from this run::A release for $TAG already has a ZIP; it was not replaced. Its files were not published by this run and may have no attestation."
            else
              gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
            fi
          elif [[ -f $notes ]]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "ProsperoTV $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "ProsperoTV $GITHUB_REF_NAME" --generate-notes
          fi
